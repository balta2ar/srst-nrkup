[project]
name = "srst-nrkup"
version = "1.0.0"
description = "NRK Download and Telegram Bot Integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuri Bochkarev", email = "baltazar.bz@gmail.com" }]
dependencies = [
    "aiohttp_middlewares==2.3.0",
    "hachoir==3.1.3",
    "diskcache==5.4.0",
    "pysubs2==1.6.1",
    "nrkdownload==3.1.2",
    "pydantic==1.9.0",
    "python-telegram-bot==21.10",
    "setuptools<81",  # nrkdownload imports pkg_resources
    "click<8.2",  # nrkdownload's old typer breaks with newer click
]

[project.urls]
Homepage = "https://github.com/balta2ar/srst-nrkup"

[project.scripts]
srst-nrkup-bot = "nrkup.nrkup_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrkup"]
